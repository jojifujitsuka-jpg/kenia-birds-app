<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケニア鳥類 リスニング・フラッシュカード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-crow"></i> ケニア鳥類 フラッシュカード
            </h1>
            <div class="text-xs bg-emerald-800 px-3 py-1.5 rounded-full border border-emerald-600">
                チェックリスト完全準拠 (全292種)
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Settings -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-6 border border-slate-200">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">英名後の待機時間</label>
                    <select id="intervalSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="5">5 秒</option>
                        <option value="10" selected>10 秒 (指定値)</option>
                        <option value="15">15 秒</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">読み上げ速度</label>
                    <select id="rateSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="0.8">ゆっくり (0.8x)</option>
                        <option value="1.0" selected>標準 (1.0x)</option>
                        <option value="1.2">速め (1.2x)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Card Section -->
        <div class="mb-6">
            <div id="cardContainer" class="w-full min-h-[300px] cursor-pointer">
                <div class="relative w-full h-full min-h-[300px] bg-white rounded-2xl shadow-lg border border-slate-200 p-6 flex flex-col justify-between items-center text-center">
                    
                    <div class="w-full flex justify-between items-center text-xs text-slate-400 border-b pb-3 border-slate-100">
                        <span id="cardCounter">1 / 292</span>
                        <span id="statusBadge" class="bg-slate-100 text-slate-600 px-2 py-1 rounded font-medium">停止中</span>
                    </div>

                    <div class="my-auto py-6 w-full">
                        <!-- B列: 英名 -->
                        <div class="mb-6">
                            <span class="text-xs uppercase tracking-wider font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">英名 (B列)</span>
                            <h2 id="englishText" class="text-2xl sm:text-4xl font-extrabold text-slate-800 mt-2 min-h-[2.5rem] flex items-center justify-center">
                                ---
                            </h2>
                            <button id="playEnBtn" class="mt-2 text-emerald-600 hover:text-emerald-700 text-sm font-medium inline-flex items-center gap-1">
                                <i class="fa-solid fa-volume-high"></i> 英名を再再生
                            </button>
                        </div>

                        <!-- カウントダウン表示 -->
                        <div id="countdownText" class="text-lg font-bold text-emerald-600 mb-4 h-6"></div>

                        <!-- A列: 和名 -->
                        <div id="japaneseSection" class="opacity-30 transition-opacity duration-300">
                            <span class="text-xs uppercase tracking-wider font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">和名 (A列)</span>
                            <h3 id="japaneseText" class="text-2xl sm:text-3xl font-bold text-slate-700 mt-2 min-h-[2rem] flex items-center justify-center">
                                ???
                            </h3>
                            <button id="playJaBtn" class="mt-2 text-slate-500 hover:text-slate-700 text-sm font-medium inline-flex items-center gap-1">
                                <i class="fa-solid fa-volume-high"></i> 和名を再再生
                            </button>
                        </div>
                    </div>

                    <div class="text-xs text-slate-400 pt-2 border-t w-full border-slate-100">
                        カードをクリックすると和名を表示できます
                    </div>

                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="flex flex-wrap gap-3 justify-center mb-8">
            <button id="prevBtn" class="bg-white hover:bg-slate-50 text-slate-700 font-semibold px-4 py-3 rounded-xl border border-slate-300 shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-chevron-left"></i> 前へ
            </button>
            
            <button id="startAutoBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition-all flex items-center gap-2 text-lg">
                <i id="startIcon" class="fa-solid fa-play"></i> <span id="startBtnText">自動再生 開始</span>
            </button>

            <button id="nextBtn" class="bg-white hover:bg-slate-50 text-slate-700 font-semibold px-4 py-3 rounded-xl border border-slate-300 shadow-sm flex items-center gap-2">
                次へ <i class="fa-solid fa-chevron-right"></i>
            </button>

            <button id="shuffleBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-shuffle"></i> シャッフル
            </button>
        </div>

        <!-- Bird List View -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                <h3 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-emerald-600"></i> 一覧リスト
                </h3>
                <input type="text" id="searchInput" placeholder="検索..." class="w-full sm:w-64 bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="max-h-80 overflow-y-auto border rounded-lg border-slate-100">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 sticky top-0 border-b border-slate-200">
                        <tr>
                            <th class="p-2.5 w-12 text-center">#</th>
                            <th class="p-2.5 font-semibold">英名 (B列)</th>
                            <th class="p-2.5 font-semibold">和名 (A列)</th>
                            <th class="p-2.5 w-16 text-center">再生</th>
                        </tr>
                    </thead>
                    <tbody id="birdTableBody" class="divide-y divide-slate-100 text-slate-700">
                    </tbody>
                </table>
            </div>
        </div>

    </main>

            {ja: "セイキチョウ", en: "Red-cheeked Cordonbleu"},
            {ja: "ズアカアオハシキンパラ", en: "Red-headed Bluebill"},

            {ja: "ケニアアカスズメ", en: "Kenya Rufous Sparrow"},
            {ja: "ハイガシラスズメ", en: "Northern Gray-headed Sparrow"},
            {ja: "ニシツメナガセキレイ", en: "Western Yellow Wagtail"},
            {ja: "ハジロハクセキレイ", en: "African Pied Wagtail"},
            {ja: "アフリカマミジロタヒバリ", en: "African Pipit"},
            {ja: "ヒバリツメナガタヒバリ", en: "Sharpe's Longclaw"},
            {ja: "キムネツメナガタヒバリ", en: "Yellow-throated Longclaw"},
            {ja: "ムナフヒワ", en: "African Citril"},
            {ja: "オオカナリア", en: "Brimstone Canary"},
            {ja: "タテフカナリア", en: "Streaky Seedeater"},
            {ja: "キクイタダキカナリア", en: "Yellow-crowned Canary"}
        ];

        let currentIndex = 0;
        let isAutoPlaying = false;
        let autoTimer = null;

        const englishText = document.getElementById('englishText');
        const japaneseText = document.getElementById('japaneseText');
        const japaneseSection = document.getElementById('japaneseSection');
        const cardCounter = document.getElementById('cardCounter');
        const statusBadge = document.getElementById('statusBadge');
        const countdownText = document.getElementById('countdownText');
        const startAutoBtn = document.getElementById('startAutoBtn');
        const startBtnText = document.getElementById('startBtnText');
        const startIcon = document.getElementById('startIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const playEnBtn = document.getElementById('playEnBtn');
        const playJaBtn = document.getElementById('playJaBtn');
        const cardContainer = document.getElementById('cardContainer');
        const intervalSelect = document.getElementById('intervalSelect');
        const rateSelect = document.getElementById('rateSelect');
        const birdTableBody = document.getElementById('birdTableBody');
        const searchInput = document.getElementById('searchInput');

        function speak(text, lang) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = parseFloat(rateSelect.value);
            window.speechSynthesis.speak(u);
        }

        function updateCard() {
            const current = checklistData[currentIndex];
            englishText.textContent = current.en;
            japaneseText.textContent = current.ja || "(和名なし)";
            cardCounter.textContent = `${currentIndex + 1} / ${checklistData.length}`;

            japaneseSection.classList.add('opacity-30');
            japaneseText.style.filter = "blur(4px)";
            renderTable();
        }

        function revealJapanese() {
            japaneseSection.classList.remove('opacity-30');
            japaneseText.style.filter = "none";
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearTimeout(autoTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            statusBadge.textContent = "停止中";
            statusBadge.className = "bg-slate-100 text-slate-600 px-2 py-1 rounded font-medium";
            countdownText.textContent = "";
            startBtnText.textContent = "自動再生 開始";
            startIcon.className = "fa-solid fa-play";
            startAutoBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition-all flex items-center gap-2 text-lg";
        }

        function processAutoStep() {
            if (!isAutoPlaying) return;

            const current = checklistData[currentIndex];
            updateCard();

            // 1. 英名を喋る
            statusBadge.textContent = "英名読み上げ中";
            statusBadge.className = "bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-medium";
            speak(current.en, 'en-US');

            const waitSeconds = parseInt(intervalSelect.value, 10);
            let remain = waitSeconds;
            countdownText.textContent = `和名表示まで: ${remain} 秒`;

            const cdInterval = setInterval(() => {
                if (!isAutoPlaying) {
                    clearInterval(cdInterval);
                    return;
                }
                remain--;
                if (remain > 0) {
                    countdownText.textContent = `和名表示まで: ${remain} 秒`;
                } else {
                    clearInterval(cdInterval);
                    countdownText.textContent = "";

                    // 2. 和名を表示して喋る
                    revealJapanese();
                    statusBadge.textContent = "和名読み上げ中";
                    statusBadge.className = "bg-blue-100 text-blue-800 px-2 py-1 rounded font-medium";
                    if (current.ja) {
                        speak(current.ja, 'ja-JP');
                    }

                    // 3. 次の鳥へ進む (2.5秒後)
                    autoTimer = setTimeout(() => {
                        if (!isAutoPlaying) return;
                        currentIndex = (currentIndex + 1) % checklistData.length;
                        processAutoStep();
                    }, 2500);
                }
            }, 1000);
        }

        startAutoBtn.addEventListener('click', () => {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                isAutoPlaying = true;
                startBtnText.textContent = "停止";
                startIcon.className = "fa-solid fa-square";
                startAutoBtn.className = "bg-rose-600 hover:bg-rose-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition-all flex items-center gap-2 text-lg";
                processAutoStep();
            }
        });

        prevBtn.addEventListener('click', () => {
            stopAutoPlay();
            currentIndex = (currentIndex - 1 + checklistData.length) % checklistData.length;
            updateCard();
        });

        nextBtn.addEventListener('click', () => {
            stopAutoPlay();
            currentIndex = (currentIndex + 1) % checklistData.length;
            updateCard();
        });

        shuffleBtn.addEventListener('click', () => {
            stopAutoPlay();
            for (let i = checklistData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [checklistData[i], checklistData[j]] = [checklistData[j], checklistData[i]];
            }
            currentIndex = 0;
            updateCard();
        });

        playEnBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            speak(checklistData[currentIndex].en, 'en-US');
        });

        playJaBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            revealJapanese();
            if (checklistData[currentIndex].ja) {
                speak(checklistData[currentIndex].ja, 'ja-JP');
            }
        });

        cardContainer.addEventListener('click', () => {
            revealJapanese();
        });

        function renderTable() {
            const query = searchInput.value.toLowerCase().trim();
            birdTableBody.innerHTML = '';

            checklistData.forEach((bird, idx) => {
                if (query && !bird.ja.toLowerCase().includes(query) && !bird.en.toLowerCase().includes(query)) {
                    return;
                }
                const tr = document.createElement('tr');
                tr.className = idx === currentIndex ? "bg-emerald-50 border-l-4 border-emerald-500 font-semibold" : "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-2.5 text-center text-xs text-slate-400">${idx + 1}</td>
                    <td class="p-2.5 text-slate-800">${bird.en}</td>
                    <td class="p-2.5 text-slate-700">${bird.ja || "(なし)"}</td>
                    <td class="p-2.5 text-center">
                        <button onclick="playSpecific(${idx})" class="text-emerald-600 hover:text-emerald-800 p-1">
                            <i class="fa-solid fa-volume-low"></i>
                        </button>
                    </td>
                `;
                birdTableBody.appendChild(tr);
            });
        }

        window.playSpecific = function(idx) {
            stopAutoPlay();
            currentIndex = idx;
            updateCard();
            revealJapanese();
            speak(checklistData[idx].en, 'en-US');
            setTimeout(() => {
                if (checklistData[idx].ja) {
                    speak(checklistData[idx].ja, 'ja-JP');
                }
            }, 1500);
        };

        searchInput.addEventListener('input', renderTable);

        window.addEventListener('DOMContentLoaded', () => {
            updateCard();
        });
    </script>
